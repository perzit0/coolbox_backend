# Configuración para desplegar el backend Coolbox en Render.
#
# La base de datos vive en Supabase (Postgres), por lo que en Render NO se
# declara ninguna base de datos administrada. Debes crear la variable
# DATABASE_URL manualmente con el string de conexión "Session pooler" de
# Supabase (formato postgresql://postgres.xxxx:PASSWORD@aws-...supabase.com:5432/postgres).
#
# El seed se ejecuta automáticamente al iniciar la app; no hace falta un
# preDeployCommand aparte, lo que evita el error "ModuleNotFoundError" al
# ejecutar scripts que dependen del app context.

services:
  - type: web
    name: coolbox-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false            # se define manualmente con la URL de Supabase
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: EMAIL_DOMAIN
        value: "coolbox.com.pe"
      - key: IGV_RATE
        value: "0.18"
